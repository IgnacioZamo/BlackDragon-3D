<!-- ===================== CATÁLOGO: categorías y piezas destacadas ===================== -->
<link rel="stylesheet" href="sections/catalogo/catalogo.css">

<!-- Categorías: cada tarjeta abre la página Productos con ese filtro -->
<section class="seccion categorias" id="catalogo" aria-labelledby="titulo-categorias">
  <div class="container">
    <div class="seccion__cabecera">
      <div>
        <p class="eyebrow">Catálogo</p>
        <h2 id="titulo-categorias">Elegí tu <span class="grad">universo</span></h2>
      </div>
      <p class="seccion__bajada">Cuatro mundos, cientos de piezas. Todo impreso en nuestro taller y revisado a mano antes de salir.</p>
    </div>

    <!-- Cada tarjeta arma un collage con las fotos de su categoría (catalogo.js).
         Las categorías y qué "filtros" del JSON entran en cada una están en js/comun.js (CATEGORIAS). -->
    <div class="categorias__grid">
      <a class="cat-card cat-card--grande reveal" href="productos.html?filtro=anime" data-categoria="anime" data-max-fotos="4">
        <span class="cat-card__collage" aria-hidden="true"></span>
        <span class="cat-card__cant">Ver productos</span>
        <span class="cat-card__flecha" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7M8 7h9v9"/></svg></span>
        <span class="cat-card__info"><strong>Anime</strong></span>
      </a>
      <a class="cat-card cat-card--alta reveal" href="productos.html?filtro=comic" data-categoria="comic" data-max-fotos="2">
        <span class="cat-card__collage" aria-hidden="true"></span>
        <span class="cat-card__cant">Ver productos</span>
        <span class="cat-card__flecha" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7M8 7h9v9"/></svg></span>
        <span class="cat-card__info"><strong>Cómic</strong></span>
      </a>
      <a class="cat-card cat-card--chica reveal" href="productos.html?filtro=personalizables" data-categoria="personalizables" data-max-fotos="2">
        <span class="cat-card__collage" aria-hidden="true"></span>
        <span class="cat-card__cant">Ver productos</span>
        <span class="cat-card__flecha" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7M8 7h9v9"/></svg></span>
        <span class="cat-card__info"><strong>Personalizables</strong></span>
      </a>
      <a class="cat-card cat-card--chica reveal" href="productos.html?filtro=creaciones-unicas" data-categoria="creaciones-unicas" data-max-fotos="2">
        <span class="cat-card__collage" aria-hidden="true"></span>
        <span class="cat-card__cant">Ver productos</span>
        <span class="cat-card__flecha" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7M8 7h9v9"/></svg></span>
        <span class="cat-card__info"><strong>Creaciones únicas</strong></span>
      </a>
    </div>
  </div>
</section>

<!-- Piezas destacadas: las tarjetas se arman con data/productos.json -->
<section class="seccion productos" id="productos" aria-labelledby="titulo-productos">
  <div class="container">
    <div class="seccion__cabecera">
      <div>
        <p class="eyebrow">Más pedidos</p>
        <h2 id="titulo-productos">Piezas <span class="grad">destacadas</span></h2>
      </div>
      <a class="btn btn--blanco" href="productos.html">Ver todos los productos <span aria-hidden="true">→</span></a>
    </div>

    <!-- Solo los productos con "destacado": true en data/productos.json -->
    <ul class="productos__grid" id="destacados"></ul>
    <p class="productos__vacio" hidden></p>
  </div>
</section>

<!-- Molde de la tarjeta: componente compartido con la página Productos -->
<div data-incluir="sections/componentes/tarjeta-producto/tarjeta-producto.html"></div>
<script src="sections/catalogo/catalogo.js"></script>
