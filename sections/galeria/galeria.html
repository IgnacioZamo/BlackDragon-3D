<!-- ===================== GALERÍA ===================== -->
<link rel="stylesheet" href="sections/galeria/galeria.css">

<section class="seccion galeria" id="galeria" aria-labelledby="titulo-galeria">
  <div class="container">
    <div class="seccion__cabecera">
      <div>
        <p class="eyebrow">Galería</p>
        <h2 id="titulo-galeria">Capa por capa,<br> <span class="grad">pieza por pieza</span></h2>
      </div>
      <p class="seccion__bajada">El detalle se ve de cerca. Así quedan nuestras piezas terminadas, listas para exhibir o pintar.</p>
    </div>

    <div class="galeria__grid">
      <figure class="gal-item gal-item--grande reveal">
        <img src="assets/img/gal-dragon-cabeza.jpg" alt="Primer plano de la cabeza del Dragón Ancestral con cuernos blancos y ojo rojo" width="1200" height="933" loading="lazy">
        <figcaption>Detalle de cabeza · Dragón Ancestral</figcaption>
      </figure>
      <figure class="gal-item reveal">
        <img src="assets/img/gal-hechicero.jpg" alt="Miniatura de hechicero encapuchado con báculo" width="579" height="394" loading="lazy">
        <figcaption>Hechicero · 32 mm</figcaption>
      </figure>
      <figure class="gal-item reveal">
        <img src="assets/img/gal-d20.jpg" alt="Dado de veinte caras gris con el número 20 en rojo" width="578" height="394" loading="lazy">
        <figcaption>D20 de colección</figcaption>
      </figure>
      <figure class="gal-item reveal">
        <img src="assets/img/gal-torre.jpg" alt="Torre modular de calabozo con bandera roja" width="579" height="395" loading="lazy">
        <figcaption>Torre modular</figcaption>
      </figure>
      <figure class="gal-item reveal">
        <img src="assets/img/gal-espadachina.jpg" alt="Figura de espadachina estilo anime de 22 cm" width="578" height="395" loading="lazy">
        <figcaption>Espadachina · 22 cm</figcaption>
      </figure>
    </div>
  </div>
</section>
