<!--- Tarjeta de beneficio. Parámetros: icono (nombre del SVG en assets/iconos/), titulo, texto -->
<!-- @usar componentes/icono-rojo -->
<article class="beneficio reveal">
  <span class="icono-rojo" aria-hidden="true"><img src="assets/iconos/{{icono}}.svg" alt="" width="26" height="26"></span>
  <h3>{{titulo}}</h3>
  <p>{{texto}}</p>
</article>
