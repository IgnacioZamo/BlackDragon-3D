<!--- Tarjeta de producto. Toda la tarjeta lleva a la ficha; el corazón y el "+" funcionan aparte.
     Parámetros: id, categorias, imagen, ancho, alto, alt, badge, badge-tipo (rojo | blanco),
                 etiqueta, nombre, resumen, precio -->
<!-- @usar componentes/badge -->
<!-- @usar componentes/precio -->
<li class="prod-card reveal" data-categorias="{{categorias}}">
  <div class="prod-card__media">
    <img src="{{imagen}}" alt="{{alt}}" width="{{ancho}}" height="{{alto}}" loading="lazy">
    <span class="badge badge--{{badge-tipo}}">{{badge}}</span>
    <!-- @incluir componentes/boton-favorito/boton-favorito.html id="{{id}}" nombre="{{nombre}}" -->
  </div>
  <div class="prod-card__info">
    <p class="prod-card__cat">{{etiqueta}}</p>
    <h3><a href="producto.html?id={{id}}" class="prod-card__link">{{nombre}}</a></h3>
    <p class="prod-card__desc">{{resumen}}</p>
    <div class="prod-card__pie">
      <p class="precio">{{precio}}</p>
      <a class="prod-card__mas" href="#" data-whatsapp-producto="{{id}}" target="_blank" rel="noopener">
        <span class="sr-only">Pedir {{nombre}} por WhatsApp</span>
        <span aria-hidden="true">+</span>
      </a>
    </div>
  </div>
</li>
