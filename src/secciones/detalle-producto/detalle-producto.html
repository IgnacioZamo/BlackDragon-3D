<!--- Ficha de producto. El contenido lo completa detalle-producto.js según el ?id= de la URL. -->
<!-- @usar componentes/badge -->
<!-- @usar componentes/precio -->
<!-- @usar componentes/lista-chips -->
<!-- @usar componentes/miniaturas -->
<!-- @usar componentes/icono-rojo -->
<!-- @usar componentes/boton -->
<main id="contenido" class="detalle">
  <div class="container">
    <nav class="detalle__migas" aria-label="Ruta de navegación">
      <a href="index.html">Inicio</a>
      <span aria-hidden="true">/</span>
      <a href="index.html#productos">Catálogo</a>
      <span aria-hidden="true">/</span>
      <span id="miga-actual" aria-current="page">Producto</span>
    </nav>

    <div class="detalle__grid" id="ficha" hidden>
      <div class="detalle__media">
        <div class="detalle__img">
          <img id="img-principal" src="assets/img/prod-dragon.jpg" alt="" width="565" height="522">
          <span class="badge" id="badge"></span>
        </div>
        <!-- @incluir componentes/boton-favorito/boton-favorito.html id="" nombre="esta pieza" -->
        <div class="miniaturas" id="miniaturas" role="group" aria-label="Imágenes del producto"></div>
      </div>

      <div class="detalle__info">
        <p class="detalle__etiqueta" id="etiqueta"></p>
        <h1 id="nombre"></h1>
        <p class="detalle__desc" id="descripcion"></p>
        <ul class="lista-chips" id="chips" aria-label="Características"></ul>

        <div class="detalle__compra">
          <p class="precio" id="precio"></p>
          <a class="btn btn--primario btn--grande" id="btn-comprar" href="#" target="_blank" rel="noopener">Pedir por WhatsApp</a>
        </div>

        <a class="detalle__medida" href="index.html#a-medida">
          <span class="icono-rojo" aria-hidden="true">✦</span>
          <span>
            <strong>¿La querés a tu manera?</strong>
            <span>Elegí colores, escala y pose</span>
          </span>
        </a>
      </div>
    </div>

    <div class="detalle__no-encontrado" id="no-encontrado" hidden>
      <h1>No encontramos esa pieza</h1>
      <p>Puede que el enlace esté incompleto o que la pieza ya no esté en el catálogo.</p>
      <a class="btn btn--primario" href="index.html#productos">Ver piezas destacadas</a>
    </div>
  </div>
</main>
