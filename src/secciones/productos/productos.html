<section class="seccion productos" id="productos" aria-labelledby="titulo-productos">
  <div class="container">
    <div class="seccion__cabecera">
      <div>
        <p class="eyebrow">Más pedidos</p>
        <h2 id="titulo-productos">Piezas <span class="grad">destacadas</span></h2>
      </div>
      <a class="btn btn--blanco" href="#catalogo">Ver todo el catálogo <span aria-hidden="true">→</span></a>
    </div>

    <div class="filtros" role="group" aria-label="Filtrar piezas por categoría">
      <button class="filtro activo" type="button" data-filtro="todo" aria-pressed="true">Todo</button>
      <button class="filtro" type="button" data-filtro="dragones" aria-pressed="false">Dragones</button>
      <button class="filtro" type="button" data-filtro="anime" aria-pressed="false">Anime</button>
      <button class="filtro" type="button" data-filtro="calabozos" aria-pressed="false">Calabozos</button>
      <button class="filtro" type="button" data-filtro="rol" aria-pressed="false">Rol</button>
      <button class="filtro" type="button" data-filtro="packs" aria-pressed="false">Packs</button>
    </div>

    <ul class="productos__grid">
